[package]
name = "livekit-wakeword"
version = "2.1.3"
edition = "2024"
description = "Streaming wake word detection for LiveKit WakeWord models, in pure Rust"
license = "Apache-2.0"
repository = "https://github.com/livekit/livekit-wakeword"
homepage = "https://github.com/livekit/livekit-wakeword/tree/main/client/rust"
readme = "README.md"
keywords = ["wake-word", "hotword", "keyword-spotting", "speech", "livekit"]
categories = ["multimedia::audio", "science"]
include = ["src/**", "examples/**", "README.md"]

[features]
# WakeWordListener: streams the microphone through a model (cpal)
listener = ["dep:cpal"]

[dependencies]
tract-onnx = "0.23"
thiserror = "2"
cpal = { version = "0.18", optional = true }

[dev-dependencies]
hound = "3.5"
serde_json = "1"

[[example]]
name = "listen"
required-features = ["listener"]

[package.metadata.docs.rs]
all-features = true
